[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-metric-backend-next"
version = "0.1.5"
description = "Independent next-generation backend for Ask Metric"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "defusedxml>=0.7.1,<1.0.0",
  "fastapi>=0.115.0",
  "gmssl>=3.2.2",
  "httpx>=0.27.0",
  "nacos-sdk-python>=2.0.11,<3.0.0",
  "PyJWT>=2.10.0",
  "pwdlib[argon2]>=0.2.1",
  "pymysql>=1.1.1,<2.0.0",
  # Keep the resolver on a tested Pydantic line.  An open-ended lower bound
  # makes pip backtrack through every historical release in offline/slow builds.
  "pydantic>=2.10.0,<2.11.0",
  "pydantic-settings>=2.7.0,<2.8.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]
identity-sync = [
  "openpyxl>=3.1.0,<4.0.0",
]

[project.scripts]
ask-metric = "ask_metric.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ask_metric*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["database: requires a disposable MySQL test database"]

[tool.ruff]
line-length = 100
exclude = ["pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
