name: ask-metric-local-chain

services:
  nacos:
    image: nacos/nacos-server:v3.2.3
    container_name: ask-metric-local-nacos
    restart: unless-stopped
    mem_limit: 768m
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_IDENTITY_KEY: local
      NACOS_AUTH_IDENTITY_VALUE: ask-metric-local
      JVM_XMS: 256m
      JVM_XMX: 384m
      JVM_XMN: 128m
      JAVA_OPT: "-Dnacos.core.auth.admin.enabled=false -Dnacos.core.auth.console.enabled=false"
    # Nacos 3.x 关闭鉴权时仍需通过启动令牌校验。
    entrypoint:
      - bash
      - -ec
      - |
        export NACOS_AUTH_TOKEN="$$(head -c 32 /dev/urandom | base64)"
        exec bash bin/docker-startup.sh
    ports:
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-8081}:8080"
    volumes:
      - nacos-local-data-v323:/home/nacos/data
      - nacos-local-logs-v323:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/ns/operator/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      ask-metric:
        ipv4_address: 172.31.240.10

  nacos-config-init:
    image: curlimages/curl:8.10.1
    container_name: ask-metric-local-nacos-config-init
    restart: "no"
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      NACOS_ADDR: http://nacos:8848
      NACOS_CONFIG_DATA_ID: znws_gateway.yaml
      NACOS_CONFIG_GROUP: DEFAULT_GROUP
      NACOS_CONFIG_FILE: /config/znws_gateway.yaml
    volumes:
      - ./nacos:/config:ro
    entrypoint: ["/bin/sh", "/config/publish-config.sh"]
    networks:
      ask-metric:
        ipv4_address: 172.31.240.11

  backend:
    build:
      context: ../backend-next
      dockerfile: Dockerfile
    image: ask-metric-local-python:dev
    container_name: ask-metric-local-python
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - ${ASK_METRIC_LOCAL_BACKEND_ENV_FILE:-../../ask-metric-v0.2-analysis-enhanced-windows/backend-next/.env}
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 8010
      LOG_DIRECTORY: /app/logs
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: public
      NACOS_GROUP: DEFAULT_GROUP
      NACOS_SERVICE_NAME: ask-metric-python
      NACOS_INSTANCE_IP: 172.31.240.20
      NACOS_INSTANCE_PORT: 8010
      NACOS_INSTANCE_ID: ask-metric-python-local
      NACOS_FAIL_FAST: "true"
      NACOS_CACHE_DIR: /tmp/ask-metric-nacos/cache
      NACOS_LOG_DIR: /tmp/ask-metric-nacos/logs
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      # 复用旧环境的真实指标测试数据，应用用户和会话仍保存在当前 3308 库。
      USE_LEGACY_METRIC_DATABASE: "${ASK_METRIC_LOCAL_USE_LEGACY_METRIC_DATABASE:-true}"
      # 模型配置保存在命名卷，初始化容器只在首次启动时复制镜像默认值。
      # 这样页面保存的模型切换在重启后仍然保留。
      MODEL_CONFIG_PATH: /app/.runtime/local-config/model-config.json
      PROMPT_CONFIG_PATH: config/prompts.json
      SEMANTIC_CONFIG_PATH: config/semantic-config.json
    volumes:
      - backend-runtime:/app/.runtime
      - backend-logs:/app/logs
      - ./backend-entrypoint.sh:/app/gateway-entrypoint.sh:ro
    depends_on:
      nacos:
        condition: service_healthy
      backend-runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)\""]
      interval: 10s
      timeout: 8s
      retries: 30
    command: ["/bin/sh", "/app/gateway-entrypoint.sh"]
    networks:
      ask-metric:
        ipv4_address: 172.31.240.20

  # named volume 首次创建时由 root 初始化，应用进程仍以镜像内的 app 用户运行。
  backend-runtime-init:
    image: ask-metric-local-python:dev
    container_name: ask-metric-local-python-runtime-init
    restart: "no"
    user: root
    command:
      - /bin/sh
      - -ec
      - |
        install -d -o app -g app /runtime/local-config
        if [ ! -f /runtime/local-config/model-config.json ]; then
          install -o app -g app /seed/model-config.json /runtime/local-config/model-config.json
        fi
    volumes:
      - backend-runtime:/runtime
      - ./runtime/model-config.json:/seed/model-config.json:ro
    networks:
      ask-metric:
        ipv4_address: 172.31.240.23

  agent:
    build:
      context: ../agent-service
      dockerfile: Dockerfile
    image: ask-metric-local-agent:dev
    container_name: ask-metric-local-agent
    restart: unless-stopped
    mem_limit: 192m
    env_file:
      - ${ASK_METRIC_LOCAL_AGENT_ENV_FILE:-../../ask-metric-v0.2-analysis-enhanced-windows/agent-service/.env}
    environment:
      AGENT_SERVICE_HOST: 0.0.0.0
      AGENT_SERVICE_PORT: 8020
      BACKEND_BASE_URL: http://backend:8010
      AGENT_DATA_DIR: /app/data
      AGENT_DEPLOYMENT_REPLICAS: 1
      AGENT_SESSION_STORAGE: jsonl
      # 沿用本机已验证的行内模型配置，覆盖仅与容器网络有关的地址。
      AGENT_MODEL_TOOL_CHOICE_POLICY: auto
    volumes:
      - agent-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      ask-metric:
        ipv4_address: 172.31.240.21

  agent-nacos-registrar:
    build:
      context: ./agent-nacos-registrar
      dockerfile: Dockerfile
    image: ask-metric-local-agent-nacos-registrar:dev
    container_name: ask-metric-local-agent-nacos-registrar
    restart: unless-stopped
    mem_limit: 64m
    environment:
      NACOS_ADDR: http://nacos:8848
      NACOS_SERVICE_NAME: ask-metric-agent
      NACOS_GROUP: DEFAULT_GROUP
      NACOS_CLUSTER_NAME: DEFAULT
      NACOS_INSTANCE_IP: 172.31.240.21
      NACOS_INSTANCE_PORT: 8020
      NACOS_REGISTER_INTERVAL_SECONDS: 5
    depends_on:
      nacos:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks:
      ask-metric:
        ipv4_address: 172.31.240.22

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ask-metric-local-gateway:dev
    container_name: ask-metric-local-gateway
    restart: unless-stopped
    mem_limit: 256m
    environment:
      SERVER_PORT: 9000
      MANAGEMENT_SERVER_PORT: 18080
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: public
      NACOS_GROUP: DEFAULT_GROUP
      NACOS_CONFIG_GROUP: DEFAULT_GROUP
      NACOS_CONFIG_DATA_ID: znws_gateway.yaml
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx192m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Duser.home=/tmp/gateway-home"
    depends_on:
      nacos-config-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      agent-nacos-registrar:
        condition: service_started
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-9000}:9000"
      - "127.0.0.1:${GATEWAY_MANAGEMENT_PORT:-18080}:18080"
    networks:
      ask-metric:
        ipv4_address: 172.31.240.30

  nginx:
    image: nginx:1.27-alpine
    container_name: ask-metric-local-nginx
    restart: unless-stopped
    mem_limit: 32m
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend-vue/dist:/usr/share/nginx/html:ro
    networks:
      ask-metric:
        ipv4_address: 172.31.240.40

volumes:
  nacos-local-data-v323:
  nacos-local-logs-v323:
  backend-runtime:
  backend-logs:
  agent-data:

networks:
  ask-metric:
    ipam:
      config:
        - subnet: 172.31.240.0/24
