name: ask-metric-formal-local

services:
  formal-nacos-config-init:
    image: curlimages/curl:8.10.1
    environment:
      NACOS_CONFIG_GROUP: ASK_METRIC_FORMAL_LOCAL
    volumes:
      - ../nacos/publish-config.sh:/config/publish-config.sh:ro
      - ./znws_gateway.yaml:/config/znws_gateway.yaml:ro
    entrypoint: ["/bin/sh", "/config/publish-config.sh"]
    networks: [ask-metric]

  formal-gateway:
    image: eclipse-temurin:17-jre
    user: "65534:65534"
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx192m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Duser.home=/tmp"
      SPRING_CONFIG_LOCATION: file:/app/config/znws_gateway.yaml,file:/app/config/znws_gateway_bootstrap.yaml
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: public
      NACOS_GROUP: DEFAULT_GROUP
      NACOS_CONFIG_DATA_ID: znws_gateway.yaml
      NACOS_CONFIG_GROUP: ASK_METRIC_FORMAL_LOCAL
      # 与既有本地网关共用发现服务，验证实例无需登记自身。
      NACOS_REGISTER_ENABLED: "false"
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    entrypoint: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ./app.jar:/app/app.jar:ro
      - ./znws_gateway.yaml:/app/config/znws_gateway.yaml:ro
      - ./znws_gateway_bootstrap.yaml:/app/config/znws_gateway_bootstrap.yaml:ro
    ports:
      - "127.0.0.1:18081:18080"
    depends_on:
      formal-nacos-config-init:
        condition: service_completed_successfully
    networks: [ask-metric]

  formal-nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./8090.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - formal-gateway
    networks: [ask-metric]

networks:
  ask-metric:
    name: ask-metric-local-chain_ask-metric
    external: true
