# 基于正式交付包的 8090.conf，使用本地 Docker 上游及静态目录。
server {
    listen 8090;
    server_name localhost 127.0.0.1;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $znws_gateway formal-gateway:9000;

    absolute_redirect off;
    index index.html;
    client_max_body_size 10m;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # SSO 回跳的查询字符串可能带有令牌。
    access_log off;

    location = /health {
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /bgwblj/znws {
        return 302 /bgwblj/znws/static/$is_args$args;
    }
    location = /bgwblj/znws/ {
        return 302 /bgwblj/znws/static/$is_args$args;
    }
    location = /bgwblj/znws/static {
        return 302 /bgwblj/znws/static/$is_args$args;
    }

    location = /bgwblj/znws/static/index.html {
        alias /usr/share/nginx/html/index.html;
        expires -1;
    }
    location ^~ /bgwblj/znws/static/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 7d;
    }
    location = /bgwblj/znws/static/ask-metric.ico {
        alias /usr/share/nginx/html/ask-metric.ico;
        expires 7d;
    }
    location /bgwblj/znws/static/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /bgwblj/znws/static/index.html;
        expires -1;
    }

    location = /bgwblj/znws/api {
        return 308 /bgwblj/znws/api/$is_args$args;
    }
    location ^~ /bgwblj/znws/api/ {
        rewrite ^/bgwblj/znws(/api/.*)$ $1 break;
        proxy_pass http://$znws_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 本地浏览器直连 Nginx，由当前连接提供协议。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_cookie_path /api/v1/auth /bgwblj/znws/api/v1/auth;
        proxy_redirect ~^https?://[^/]+(/api(?:/.*)?)$ /bgwblj/znws$1;
        proxy_redirect ~^(/api(?:/.*)?)$ /bgwblj/znws$1;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_next_upstream off;
    }

    location / {
        return 404;
    }
}
