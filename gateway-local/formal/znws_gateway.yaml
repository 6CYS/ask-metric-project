server:
  port: ${SERVER_PORT:9000}
  forward-headers-strategy: framework

spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 200s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST
            - AddResponseHeader=X-Gateway-Name, ask-metric-intent-gateway
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - http://localhost:8090
                  - http://127.0.0.1:8090
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - '*'
                exposedHeaders:
                  - Content-Disposition
                  - Authorization
                allowCredentials: true
                maxAge: 3600
          routes:
            # v0.3 的 Agent 入口与 Python 共用 /api，须先匹配并剥离 Agent 前缀。
            - id: ask-metric-agent-api
              order: -100
              uri: lb://ask-metric-agent
              predicates:
                - Path=/api/agent,/api/agent/**
              filters:
                - StripPrefix=2
            - id: ask-metric-backend-api
              uri: lb://ask-metric-python
              predicates:
                - Path=/api/**
              filters:
                # Python 会用浏览器 Host 校验登录及会话恢复请求的来源。
                - PreserveHostHeader
            - id: ask-metric-backend-health
              uri: lb://ask-metric-python
              predicates:
                - Path=/health,/health/**

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:18080}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Spring Cloud Gateway for Ask Metric Intent
