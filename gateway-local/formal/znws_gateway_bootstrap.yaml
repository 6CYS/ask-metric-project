spring:
  application:
    name: ask-metric-intent-gateway
  config:
    import: nacos:${NACOS_CONFIG_DATA_ID:znws_gateway.yaml}
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:${NACOS_GROUP:DEFAULT_GROUP}}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        timeout: ${NACOS_CONFIG_TIMEOUT_MS:5000}
        refresh-enabled: ${NACOS_CONFIG_REFRESH_ENABLED:true}
        preference: remote
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER_NAME:DEFAULT}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        metadata:
          management.context-path: /actuator
        ip: ${NACOS_INSTANCE_IP:}
