<style>text {font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;fill:#21364f} .code {font-family:Menlo,Consolas,monospace} .muted {fill:#5c7189}</style>
<rect width="1280" height="1810" fill="white"/>
<text x="36" y="49" font-size="30" font-weight="650">改造前｜模型提交提案，程序组织任务与执行</text><text x="36" y="83" font-size="17" style="fill:#5c7189">代码基线：73f1db5 · semantic_v2　｜　展示代码中的分支，不代表某句话的实测运行轨迹</text><rect x="36" y="104" width="19" height="15" rx="3" fill="#eaf2fd" stroke="#bdcfe1"/><text x="63" y="117" font-size="15" style="fill:#52667c">模型选择</text><rect x="205" y="104" width="19" height="15" rx="3" fill="#f4f6f9" stroke="#bdcfe1"/><text x="232" y="117" font-size="15" style="fill:#52667c">宿主 / 程序自动执行</text><rect x="490" y="104" width="19" height="15" rx="3" fill="#edf7f4" stroke="#bdcfe1"/><text x="517" y="117" font-size="15" style="fill:#52667c">Python 业务后端</text><text x="895" y="117" font-size="15" style="fill:#52667c">实线：调用 / 返回　虚线：条件分支 / 循环</text><rect x="390" y="155" width="500" height="75" rx="11" fill="#265faa" stroke="#265faa" stroke-width="1.5"/><text x="412" y="189" font-size="22" font-weight="650" style="fill:white">用户提交业务问题</text><text x="412" y="220" font-size="17" style="fill:#e7f0ff">页面 → Agent 服务</text><rect x="390" y="275" width="500" height="110" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="412" y="309" font-size="22" font-weight="650">01 · Pi 宿主准备模型上下文</text><text x="412" y="340" font-size="17" style="fill:#526b84" class="code">AgentHarness · main lane</text><text x="412" y="367" font-size="18" style="fill:#526b84">历史、机构目录、任务状态与业务方法目录</text><rect x="390" y="445" width="500" height="115" rx="11" fill="#edf4fe" stroke="#9bbbe4" stroke-width="1.5"/><text x="412" y="479" font-size="22" font-weight="650">02 · 模型提出语义任务</text><text x="412" y="510" font-size="18" style="fill:#526b84" class="code">resolve_business_turn</text><text x="412" y="537" font-size="18" style="fill:#526b84">模型表达要查什么、怎么分析、如何继承条件</text><rect x="390" y="615" width="235" height="100" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="412" y="649" font-size="21" font-weight="650">普通查询</text><text x="412" y="680" font-size="17" style="fill:#526b84" class="code">target.query</text><text x="412" y="707" font-size="17" style="fill:#526b84">指标 / 机构 / 期间</text><rect x="655" y="615" width="235" height="100" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="677" y="649" font-size="21" font-weight="650">分析请求</text><text x="677" y="680" font-size="17" style="fill:#526b84" class="code">target.analysis</text><text x="677" y="707" font-size="17" style="fill:#526b84">分析目标与步骤计划</text><rect x="390" y="770" width="500" height="130" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="412" y="804" font-size="22" font-weight="650">03 · 程序绑定并检查执行条件</text><text x="412" y="835" font-size="16" style="fill:#526b84" class="code">SemanticPlanService → SemanticTaskService</text><text x="412" y="862" font-size="18" style="fill:#526b84">绑定正式指标、机构、期间，生成 Task / Frame</text><text x="412" y="889" font-size="18" style="fill:#526b84">确认可执行步骤及对应许可</text><rect x="390" y="960" width="500" height="110" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="412" y="994" font-size="22" font-weight="650">04 · after_tool 自动执行或复用</text><text x="412" y="1025" font-size="17" style="fill:#526b84" class="code">ready → execute_business_frame</text><text x="412" y="1052" font-size="17" style="fill:#526b84" class="code">reused → read_business_result</text><rect x="390" y="1130" width="500" height="115" rx="11" fill="#eef8f5" stroke="#96c6b9" stroke-width="1.5"/><text x="412" y="1164" font-size="22" font-weight="650">05 · 获准工具调用 Python 业务后端</text><text x="412" y="1195" font-size="16" style="fill:#526b84" class="code">createBusinessTools().execute(schema.tool)</text><text x="412" y="1222" font-size="18" style="fill:#526b84">查询 / 经营概览 / 通用分析 → 受控 SQL 与计算</text><rect x="950" y="1130" width="285" height="115" rx="11" fill="#eef8f5" stroke="#96c6b9" stroke-width="1.5"/><text x="972" y="1164" font-size="22" font-weight="650">数据库</text><text x="972" y="1195" font-size="18" style="fill:#526b84">按正式条件查询</text><text x="972" y="1222" font-size="18" style="fill:#526b84">返回指标与业务数据</text><rect x="390" y="1305" width="500" height="100" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="412" y="1339" font-size="22" font-weight="650">06 · 回执返回宿主，分路交付</text><text x="412" y="1370" font-size="18" style="fill:#526b84">成功结果、分析证据、待澄清项和失败原因</text><text x="412" y="1397" font-size="15" style="fill:#526b84">下面仅展开成功结果的两条交付路径</text><rect x="40" y="1465" width="440" height="140" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="62" y="1499" font-size="21" font-weight="650">普通查询：满足直出条件</text><text x="62" y="1530" font-size="18" style="fill:#526b84">directQueryDelivery = on 且校验合格</text><text x="62" y="1557" font-size="18" style="fill:#526b84">prepareDirectQueryDelivery 生成结果快照</text><text x="62" y="1584" font-size="18" style="fill:#526b84">宿主直接结束本轮并交付</text><rect x="580" y="1465" width="655" height="140" rx="11" fill="#edf4fe" stroke="#9bbbe4" stroke-width="1.5"/><text x="602" y="1499" font-size="21" font-weight="650">其余成功查询 / 分析：结果交回模型</text><text x="602" y="1530" font-size="18" style="fill:#526b84">模型可继续读取、补查，或组织回答</text><text x="602" y="1557" font-size="16" style="fill:#526b84">分析报告：analysis_report_present / business_report_present</text><text x="602" y="1584" font-size="18" style="fill:#526b84">按交付协议处理后返回页面</text><rect x="390" y="1665" width="500" height="85" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="412" y="1699" font-size="22" font-weight="650">07 · 页面展示，结果进入会话历史</text><text x="412" y="1730" font-size="18" style="fill:#526b84">回答、表格 / 图表、执行进展，供下一轮使用</text><rect x="30" y="295" width="285" height="290" rx="11" fill="#fafbfd" stroke="#d6e0eb" stroke-width="1.5"/><text x="52" y="329" font-size="21" font-weight="650">按需读取资料</text><text x="52" y="360" font-size="16" style="fill:#526b84">方法：business_skill_read</text><text x="52" y="387" font-size="16" style="fill:#526b84">主题：business_topic_read</text><text x="52" y="414" font-size="18" style="fill:#526b84">可读取业务主题及知识正文</text><text x="52" y="441" font-size="18" style="fill:#526b84"></text><text x="52" y="468" font-size="18" style="fill:#526b84">指标：目录检索工具</text><text x="52" y="495" font-size="18" style="fill:#526b84">返回指标候选与定义，再选取</text><text x="52" y="522" font-size="18" style="fill:#526b84">首轮自动带的是方法目录，</text><text x="52" y="549" font-size="18" style="fill:#526b84">并非按原问题自动召回知识正文</text><rect x="950" y="770" width="285" height="180" rx="11" fill="#fafbfd" stroke="#d6e0eb" stroke-width="1.5"/><text x="972" y="804" font-size="21" font-weight="650">条件未准备好时</text><text x="972" y="835" font-size="18" style="fill:#526b84">needs_user → 发出澄清</text><text x="972" y="862" font-size="18" style="fill:#526b84">保存条件，收到用户回答后</text><text x="972" y="889" font-size="18" style="fill:#526b84">再进入语义任务解析</text><text x="972" y="916" font-size="18" style="fill:#526b84">可修正错误 → 回模型调整</text><rect x="30" y="815" width="285" height="225" rx="11" fill="#fafbfd" stroke="#d6e0eb" stroke-width="1.5"/><text x="52" y="849" font-size="19" font-weight="650">这里的任务管理是什么？</text><text x="52" y="880" font-size="18" style="fill:#526b84">Task：用户要完成的业务任务</text><text x="52" y="907" font-size="18" style="fill:#526b84">Plan：查询 / 分析步骤</text><text x="52" y="934" font-size="18" style="fill:#526b84">Frame：已绑定的执行条件</text><text x="52" y="961" font-size="18" style="fill:#526b84"></text><text x="52" y="988" font-size="18" style="fill:#526b84">模型给提案；程序负责绑定、</text><text x="52" y="1015" font-size="18" style="fill:#526b84">判断状态和执行获准动作</text><rect x="30" y="1105" width="285" height="115" rx="11" fill="#fafbfd" stroke="#d6e0eb" stroke-width="1.5"/><text x="52" y="1139" font-size="21" font-weight="650">复用路径</text><text x="52" y="1170" font-size="18" style="fill:#526b84">reused：读取已有结果</text><text x="52" y="1197" font-size="17" style="fill:#526b84">直接到 06，不重跑业务查询</text><rect x="950" y="1305" width="285" height="100" rx="11" fill="#fafbfd" stroke="#d6e0eb" stroke-width="1.5"/><text x="972" y="1339" font-size="21" font-weight="650">未成功的回执</text><text x="972" y="1370" font-size="18" style="fill:#526b84">按状态澄清、恢复或结束</text><text x="972" y="1397" font-size="18" style="fill:#526b84">不等同于正常查询结果</text><path d="M640,230 L640,275" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M640,385 L640,445" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M315,500 L390,500" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M640,560 L640,585 L507,585 L507,615" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M640,585 L772,585 L772,615" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M507,715 L507,745 L640,745 L640,770" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M772,715 L772,745 L640,745" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M640,900 L640,960" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="655" y="935" font-size="16" style="fill:#5c7189">ready / reused</text><path d="M890,830 L950,830" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M950,865 L925,865 L925,500 L890,500" fill="none" stroke="#3b837c" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#loop)"/><path d="M640,1070 L640,1130" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="655" y="1104" font-size="16" style="fill:#5c7189">仅 ready：新执行</text><path d="M390,1040 L373,1040 L373,1345 L390,1345" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M890,1160 L950,1160" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M950,1212 L890,1212" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M640,1245 L640,1305" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M890,1355 L950,1355" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M640,1405 L640,1435 L260,1435 L260,1465" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M640,1435 L907,1435 L907,1465" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M907,1465 L907,1422 L350,1422 L350,500 L390,500" fill="none" stroke="#3b837c" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#loop)"/><text transform="translate(337,1195) rotate(-90)" font-size="16" style="fill:#3b837c">证据回模型；必要时继续工具循环</text><path d="M260,1605 L260,1635 L640,1635 L640,1665" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M907,1605 L907,1635 L640,1635" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="36" y="1784" font-size="17" style="fill:#5c7189">旧版已经有 Pi、语义理解、业务知识工具和分析能力；改变的是问数主流程的组织方式。</text></svg>