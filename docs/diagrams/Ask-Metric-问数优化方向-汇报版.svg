<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1360" viewBox="0 0 1120 1360" role="img"><title>Ask Metric 问数优化方向（汇报版）</title><desc>沿现有问数流程说明业务知识、指标选择、真实数据查询、回答和连续追问，并标注后续重点。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7793b1"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#43857c"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#243a54}</style><rect width="1120" height="1360" fill="white"/><text x="32" y="50" font-size="30" font-weight="650" text-anchor="start" style="fill:#243a54">Ask Metric｜问数优化方向</text><text x="32" y="84" font-size="18" font-weight="400" text-anchor="start" style="fill:#5b7189">让业务问题找对指标、查准数据，并能自然地连续追问</text><text x="32" y="115" font-size="16" font-weight="400" text-anchor="start" style="fill:#5b7189">主流程已有基础；橙色标出后续完善与验证重点。</text><rect x="350" y="153" width="430" height="82" rx="11" fill="#285fa8" stroke="#285fa8" stroke-width="1.4"/><text x="372" y="187" font-size="22" font-weight="650" text-anchor="start" style="fill:white">用户用业务语言提问</text><text x="372" y="219" font-size="17" font-weight="400" text-anchor="start" style="fill:#e5efff">例如：紫金银行的经营状况如何？</text><rect x="350" y="283" width="430" height="112" rx="11" fill="#eef4fd" stroke="#acc6e6" stroke-width="1.4"/><text x="372" y="317" font-size="22" font-weight="650" text-anchor="start" style="fill:#243a54">01 · 理解业务问题</text><text x="372" y="349" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">结合当前提问和可用历史</text><text x="372" y="376" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">明确机构、期间和分析目标</text><rect x="350" y="463" width="430" height="112" rx="11" fill="#eef4fd" stroke="#acc6e6" stroke-width="1.4"/><text x="372" y="497" font-size="22" font-weight="650" text-anchor="start" style="fill:#243a54">02 · 选择正式指标</text><text x="372" y="529" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">从相关知识和指标目录中选择候选</text><text x="372" y="556" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">核对指标定义、单位和统计口径</text><rect x="350" y="643" width="430" height="112" rx="11" fill="#eff8f5" stroke="#a0cbbf" stroke-width="1.4"/><text x="372" y="677" font-size="22" font-weight="650" text-anchor="start" style="fill:#243a54">03 · 查询真实数据并计算</text><text x="372" y="709" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">在权限范围内按机构、期间取数</text><text x="372" y="736" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">完成适用的对比、趋势和排名</text><rect x="350" y="823" width="430" height="112" rx="11" fill="#eef4fd" stroke="#acc6e6" stroke-width="1.4"/><text x="372" y="857" font-size="22" font-weight="650" text-anchor="start" style="fill:#243a54">04 · 形成有依据的业务回答</text><text x="372" y="889" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">结合实际结果组织结论</text><text x="372" y="916" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">核对数值和来源，说明资料缺口</text><rect x="350" y="1003" width="430" height="112" rx="11" fill="#eef4fd" stroke="#acc6e6" stroke-width="1.4"/><text x="372" y="1037" font-size="22" font-weight="650" text-anchor="start" style="fill:#243a54">05 · 展示结果，支持继续追问</text><text x="372" y="1069" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">提供文字、图表、明细和查询依据</text><text x="372" y="1096" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">继续讨论时，正确继承或调整条件</text><rect x="28" y="420" width="270" height="172" rx="11" fill="#f7f9fc" stroke="#d0ddeb" stroke-width="1.4"/><text x="50" y="454" font-size="22" font-weight="650" text-anchor="start" style="fill:#243a54">相关业务知识</text><text x="50" y="486" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">说明“怎样看这个业务”</text><text x="50" y="513" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">提供关联指标作为候选</text><text x="50" y="570" font-size="16" font-weight="650" text-anchor="start" style="fill:#986a22">重点：知识可信、关联准确</text><rect x="830" y="420" width="262" height="172" rx="11" fill="#f7f9fc" stroke="#d0ddeb" stroke-width="1.4"/><text x="852" y="454" font-size="22" font-weight="650" text-anchor="start" style="fill:#243a54">指标与机构资料</text><text x="852" y="486" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">正式指标口径与机构层级</text><text x="852" y="513" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">数据覆盖和可用期间</text><text x="852" y="570" font-size="16" font-weight="650" text-anchor="start" style="fill:#986a22">重点：首批资料梳理完整</text><rect x="830" y="643" width="262" height="112" rx="11" fill="#eff8f5" stroke="#a0cbbf" stroke-width="1.4"/><text x="852" y="677" font-size="22" font-weight="650" text-anchor="start" style="fill:#243a54">业务数据库</text><text x="852" y="709" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">这里取得实际业务数值</text><text x="852" y="736" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">没有数据时如实说明</text><rect x="28" y="825" width="270" height="180" rx="11" fill="#f7f9fc" stroke="#d0ddeb" stroke-width="1.4"/><text x="50" y="859" font-size="22" font-weight="650" text-anchor="start" style="fill:#243a54">连续追问</text><text x="50" y="891" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">“江南的呢？”</text><text x="50" y="918" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">“和江南比呢？”</text><text x="50" y="945" font-size="17" font-weight="400" text-anchor="start" style="fill:#5b7189">“再看贷款质量呢？”</text><text x="50" y="983" font-size="16" font-weight="650" text-anchor="start" style="fill:#986a22">重点：分清继承、比较和换题</text><path d="M565,235 L565,283" fill="none" stroke="#7793b1" stroke-width="1.8"  marker-end="url(#a)"/><path d="M565,395 L565,463" fill="none" stroke="#7793b1" stroke-width="1.8"  marker-end="url(#a)"/><path d="M298,505 L350,505" fill="none" stroke="#7793b1" stroke-width="1.8"  marker-end="url(#a)"/><path d="M830,505 L780,505" fill="none" stroke="#7793b1" stroke-width="1.8"  marker-end="url(#a)"/><path d="M565,575 L565,643" fill="none" stroke="#7793b1" stroke-width="1.8"  marker-end="url(#a)"/><path d="M780,675 L830,675" fill="none" stroke="#7793b1" stroke-width="1.8"  marker-end="url(#a)"/><path d="M830,727 L780,727" fill="none" stroke="#7793b1" stroke-width="1.8"  marker-end="url(#a)"/><path d="M565,755 L565,823" fill="none" stroke="#7793b1" stroke-width="1.8"  marker-end="url(#a)"/><path d="M565,935 L565,1003" fill="none" stroke="#7793b1" stroke-width="1.8"  marker-end="url(#a)"/><path d="M350,895 L322,895 L322,548 L350,548" fill="none" stroke="#43857c" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="28" y="675" font-size="18" font-weight="650" text-anchor="start" style="fill:#43857c">依据不足时</text><text x="28" y="704" font-size="17" font-weight="400" text-anchor="start" style="fill:#43857c">允许定向补查；</text><text x="28" y="732" font-size="17" font-weight="400" text-anchor="start" style="fill:#43857c">减少无效的反复尝试。</text><path d="M350,1065 L310,1065 L310,1035 L163,1035 L163,1005" fill="none" stroke="#43857c" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="32" y="1173" font-size="23" font-weight="650" text-anchor="start" style="fill:#243a54">接下来，用真实业务问题验证三件事</text><rect x="32" y="1197" width="330" height="111" rx="10" fill="#fffaf2" stroke="#dbbf90"/><text x="52" y="1228" font-size="21" font-weight="650" text-anchor="start" style="fill:#243a54">问得准</text><text x="52" y="1258" font-size="16" font-weight="400" text-anchor="start" style="fill:#5b7189">指标、机构、日期和口径正确</text><text x="52" y="1284" font-size="16" font-weight="400" text-anchor="start" style="fill:#5b7189">数值与业务结论有真实依据</text><rect x="395" y="1197" width="330" height="111" rx="10" fill="#fffaf2" stroke="#dbbf90"/><text x="415" y="1228" font-size="21" font-weight="650" text-anchor="start" style="fill:#243a54">接得上</text><text x="415" y="1258" font-size="16" font-weight="400" text-anchor="start" style="fill:#5b7189">能继承条件、追加比较和换题</text><text x="415" y="1284" font-size="16" font-weight="400" text-anchor="start" style="fill:#5b7189">不要求用户反复补充已知信息</text><rect x="758" y="1197" width="330" height="111" rx="10" fill="#fffaf2" stroke="#dbbf90"/><text x="778" y="1228" font-size="21" font-weight="650" text-anchor="start" style="fill:#243a54">答得快</text><text x="778" y="1258" font-size="16" font-weight="400" text-anchor="start" style="fill:#5b7189">定位模型、检索和查询耗时</text><text x="778" y="1284" font-size="16" font-weight="400" text-anchor="start" style="fill:#5b7189">减少重复调用，合理复用结果</text><text x="32" y="1341" font-size="15" font-weight="400" text-anchor="start" style="fill:#667b91">首批驾驶舱场景稳定后，再逐步扩展贡献分析和业务明细；图中示例不代表该问题已通过实测。</text></svg>