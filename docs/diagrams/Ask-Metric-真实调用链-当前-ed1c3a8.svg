<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1855" viewBox="0 0 1280 1855" role="img">
<title>现在｜模型在工具循环中调查，业务后端受控执行</title><desc>代码基线：develop-ws · ed1c3a8　｜　新请求走 inquiry_v1；以下为已提交代码，不代表运行验收结论</desc>
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#7892af"/></marker>
 <marker id="loop" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#3b837c"/></marker>
</defs>
<style>text {font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;fill:#21364f} .code {font-family:Menlo,Consolas,monospace} .muted {fill:#5c7189}</style>
<rect width="1280" height="1855" fill="white"/>
<text x="36" y="49" font-size="30" font-weight="650">现在｜模型在工具循环中调查，业务后端受控执行</text><text x="36" y="83" font-size="17" style="fill:#5c7189">代码基线：develop-ws · ed1c3a8　｜　新请求走 inquiry_v1；以下为已提交代码，不代表运行验收结论</text><rect x="36" y="104" width="19" height="15" rx="3" fill="#eaf2fd" stroke="#bdcfe1"/><text x="63" y="117" font-size="15" style="fill:#52667c">模型选择</text><rect x="205" y="104" width="19" height="15" rx="3" fill="#f4f6f9" stroke="#bdcfe1"/><text x="232" y="117" font-size="15" style="fill:#52667c">宿主 / 程序自动执行</text><rect x="490" y="104" width="19" height="15" rx="3" fill="#edf7f4" stroke="#bdcfe1"/><text x="517" y="117" font-size="15" style="fill:#52667c">Python 业务后端</text><text x="895" y="117" font-size="15" style="fill:#52667c">实线：调用 / 返回　虚线：条件分支 / 循环</text><rect x="390" y="155" width="500" height="75" rx="11" fill="#265faa" stroke="#265faa" stroke-width="1.5"/><text x="412" y="189" font-size="22" font-weight="650" style="fill:white">用户提交问题或连续追问</text><text x="412" y="220" font-size="17" style="fill:#e7f0ff">页面 → Agent 服务</text><rect x="390" y="275" width="500" height="110" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="412" y="309" font-size="22" font-weight="650">01 · Pi 宿主接收本轮任务</text><text x="412" y="340" font-size="17" style="fill:#526b84" class="code">acceptPrompt → lane.accept</text><text x="412" y="367" font-size="18" style="fill:#526b84">核对输入，冻结可继承的主目标基线</text><rect x="390" y="450" width="500" height="135" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="412" y="484" font-size="22" font-weight="650">02 · 每次调用模型前，组装上下文</text><text x="412" y="515" font-size="16" style="fill:#526b84" class="code">transform_context → prepareInquiryHistory</text><text x="412" y="542" font-size="18" style="fill:#526b84">已授权历史 + 当前问题 + 主目标参考</text><text x="412" y="569" font-size="18" style="fill:#526b84">并行准备业务知识、机构目录，再注入模型</text><rect x="390" y="675" width="500" height="125" rx="11" fill="#edf4fe" stroke="#9bbbe4" stroke-width="1.5"/><text x="412" y="709" font-size="22" font-weight="650">03 · 模型理解当前目标，选择下一步</text><text x="412" y="740" font-size="18" style="fill:#526b84">资料足够则选指标；不足则检索或澄清</text><text x="412" y="767" font-size="18" style="fill:#526b84">查询时声明 target_change，程序解析继承 / 变更</text><text x="412" y="794" font-size="16" style="fill:#526b84">不是由程序提前猜定这一轮属于哪种追问</text><rect x="390" y="925" width="500" height="165" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="412" y="959" font-size="21" font-weight="650">04 · 宿主准入后执行模型选择的工具</text><text x="412" y="990" font-size="17" style="fill:#526b84" class="code">before_tool → inquiryToolAdmission</text><text x="412" y="1017" font-size="18" style="fill:#526b84">检索：metric_search / business_knowledge_search</text><text x="412" y="1044" font-size="18" style="fill:#526b84">取数：metric_query / metric_availability</text><text x="412" y="1071" font-size="18" style="fill:#526b84">读取 / 计算：analysis_read / analysis_calculate</text><rect x="390" y="1165" width="500" height="140" rx="11" fill="#eef8f5" stroke="#96c6b9" stroke-width="1.5"/><text x="412" y="1199" font-size="22" font-weight="650">05 · 取数交给 Python 业务后端</text><text x="412" y="1230" font-size="16" style="fill:#526b84" class="code">metric_query → /api/v1/analysis/execute</text><text x="412" y="1257" font-size="18" style="fill:#526b84">绑定正式指标、机构、期间 → 权限与受控查询</text><text x="412" y="1284" font-size="17" style="fill:#526b84">返回数据、单位、来源和执行回执</text><rect x="950" y="1165" width="285" height="120" rx="11" fill="#eef8f5" stroke="#96c6b9" stroke-width="1.5"/><text x="972" y="1199" font-size="22" font-weight="650">数据库</text><text x="972" y="1230" font-size="18" style="fill:#526b84">这里才取得真实业务数值</text><text x="972" y="1257" font-size="18" style="fill:#526b84">模型不直接登录数据库</text><rect x="390" y="1455" width="500" height="165" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="412" y="1489" font-size="22" font-weight="650">06 · 业务回答进入统一交付入口</text><text x="412" y="1520" font-size="18" style="fill:#526b84">模型显式调用 analysis_answer，或</text><text x="412" y="1547" font-size="18" style="fill:#526b84">自然正文 → inquiryResponse 自动包装</text><text x="412" y="1574" font-size="16" style="fill:#526b84" class="code">executeInquiryReport → /analysis/report</text><text x="412" y="1601" font-size="18" style="fill:#526b84">核对来源、数值、目标覆盖，组织图表与明细</text><rect x="390" y="1685" width="500" height="85" rx="11" fill="#f5f7fa" stroke="#c8d5e4" stroke-width="1.5"/><text x="412" y="1719" font-size="22" font-weight="650">07 · 页面展示，结果进入会话历史</text><text x="412" y="1750" font-size="18" style="fill:#526b84">回答、图表、明细与进展；下一轮读取已授权历史</text><rect x="30" y="400" width="285" height="255" rx="11" fill="#fafbfd" stroke="#d6e0eb" stroke-width="1.5"/><text x="52" y="434" font-size="21" font-weight="650">自动召回业务知识</text><text x="52" y="465" font-size="15" style="fill:#526b84" class="code">loadTurnBusinessKnowledge</text><text x="52" y="492" font-size="18" style="fill:#526b84">原问题 + 可用上下文关键词</text><text x="52" y="519" font-size="18" style="fill:#526b84">文字匹配、评分、选取少量知识</text><text x="52" y="546" font-size="18" style="fill:#526b84">有关联时附 linked_catalog</text><text x="52" y="573" font-size="18" style="fill:#526b84">提供正式指标候选与口径</text><text x="52" y="600" font-size="18" style="fill:#526b84">相同输入复用本轮快照</text><text x="52" y="627" font-size="18" style="fill:#526b84">此处没有调用 Embedding</text><rect x="950" y="450" width="285" height="135" rx="11" fill="#fafbfd" stroke="#d6e0eb" stroke-width="1.5"/><text x="972" y="484" font-size="21" font-weight="650">机构参考信息</text><text x="972" y="515" font-size="17" style="fill:#526b84" class="code">orgCatalog</text><text x="972" y="542" font-size="18" style="fill:#526b84">账号所属机构与可用机构目录</text><text x="972" y="569" font-size="18" style="fill:#526b84">实际访问权限仍在后端检查</text><rect x="950" y="675" width="285" height="135" rx="11" fill="#edf4fe" stroke="#9bbbe4" stroke-width="1.5"/><text x="972" y="709" font-size="21" font-weight="650">澄清 / 通用解释</text><text x="972" y="740" font-size="16" style="fill:#526b84" class="code">respond_without_</text><text x="972" y="767" font-size="16" style="fill:#526b84" class="code">business_action</text><text x="972" y="794" font-size="16" style="fill:#526b84">无本轮查询证据时，可直接回复</text><rect x="30" y="885" width="285" height="255" rx="11" fill="#fafbfd" stroke="#d6e0eb" stroke-width="1.5"/><text x="52" y="919" font-size="21" font-weight="650">指标目录检索</text><text x="52" y="950" font-size="13" style="fill:#526b84" class="code">metric_search → /analysis/catalog</text><text x="52" y="977" font-size="18" style="fill:#526b84">按名称、编码、别名查候选</text><text x="52" y="1004" font-size="18" style="fill:#526b84">没有精确命中且功能启用时：</text><text x="52" y="1031" font-size="18" style="fill:#526b84">Embedding → 向量近似推荐</text><text x="52" y="1058" font-size="18" style="fill:#526b84">候选仍需核对正式指标口径</text><text x="52" y="1085" font-size="18" style="fill:#526b84"></text><text x="52" y="1112" font-size="18" style="fill:#526b84">返回的是定义，不是业务数值</text><rect x="950" y="925" width="285" height="165" rx="11" fill="#fafbfd" stroke="#d6e0eb" stroke-width="1.5"/><text x="972" y="959" font-size="21" font-weight="650">追问如何生效</text><text x="972" y="990" font-size="17" style="fill:#526b84" class="code">resolveInquiryTarget</text><text x="972" y="1017" font-size="18" style="fill:#526b84">结合模型声明与历史基线</text><text x="972" y="1044" font-size="18" style="fill:#526b84">保存主题、机构与期间</text><text x="972" y="1071" font-size="18" style="fill:#526b84">指标按当前问题继续选择</text><rect x="30" y="1265" width="285" height="170" rx="11" fill="#fafbfd" stroke="#d6e0eb" stroke-width="1.5"/><text x="52" y="1299" font-size="21" font-weight="650">工具失败 / 交付未通过</text><text x="52" y="1330" font-size="18" style="fill:#526b84">可恢复错误：预算内修正</text><text x="52" y="1357" font-size="18" style="fill:#526b84">缺证据时允许定向补查</text><text x="52" y="1384" font-size="18" style="fill:#526b84">权限失败停止相关访问</text><text x="52" y="1411" font-size="18" style="fill:#526b84">事实兜底须满足来源等条件</text><rect x="950" y="1455" width="285" height="165" rx="11" fill="#fafbfd" stroke="#d6e0eb" stroke-width="1.5"/><text x="972" y="1489" font-size="21" font-weight="650">交付入口说明</text><text x="972" y="1520" font-size="18" style="fill:#526b84">自然正文复用同一报告入口</text><text x="972" y="1547" font-size="18" style="fill:#526b84">无需额外一轮模型包装正文</text><text x="972" y="1574" font-size="18" style="fill:#526b84">正文流式启用时，要求模型</text><text x="972" y="1601" font-size="18" style="fill:#526b84">直接调用 analysis_answer</text><path d="M640,230 L640,275" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M640,385 L640,450" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M315,510 L390,510" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M950,510 L890,510" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M640,585 L640,675" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="655" y="627" font-size="16" style="fill:#5c7189">问题 + 历史 + 检索资料 → 模型</text><path d="M890,715 L950,715" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M640,800 L640,925" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="655" y="860" font-size="16" style="fill:#5c7189">需要调查：选择工具</text><path d="M390,980 L315,980" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M315,1080 L345,1080 L345,550 L390,550" fill="none" stroke="#3b837c" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#loop)"/><path d="M890,1000 L950,1000" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M640,1090 L640,1165" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="655" y="1132" font-size="16" style="fill:#5c7189">metric_query 取数分支</text><path d="M890,1198 L950,1198" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M950,1250 L890,1250" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M390,1055 L345,1055 L345,550" fill="none" stroke="#3b837c" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#loop)"/><path d="M390,1245 L345,1245 L345,1080" fill="none" stroke="#3b837c" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#loop)"/><text transform="translate(334,865) rotate(-90)" font-size="16" style="fill:#3b837c">工具回执 → 重新组装上下文 → 模型</text><path d="M890,765 L925,765 L925,855 L1260,855 L1260,1415 L850,1415 L850,1455" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="955" y="844" font-size="16" style="fill:#5c7189">证据足够：模型组织业务回答</text><text x="950" y="1387" font-size="16" style="fill:#5c7189">此路径从模型节点进入交付</text><path d="M390,1560 L345,1560 L345,1245" fill="none" stroke="#3b837c" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#loop)"/><text x="368" y="1400" font-size="16" style="fill:#3b837c">可恢复问题返回工具循环</text><path d="M640,1620 L640,1685" fill="none" stroke="#7892af" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="36" y="1805" font-size="16" style="fill:#5c7189">RAG 对应：召回相关资料 → 放入模型上下文 → 模型结合资料生成回答；数据库取数另由工具完成。</text><text x="36" y="1835" font-size="16" style="fill:#5c7189">新流程仍会在工具内部组装执行计划并保留后端保护；它并不是让模型自由执行 SQL。</text></svg>