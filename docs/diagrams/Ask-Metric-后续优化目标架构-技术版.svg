<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1830" viewBox="0 0 1600 1830" role="img">
<title>Ask Metric 后续优化目标架构（技术版）</title>
<desc>基于 develop-ws 9707568 已有问数主链。展示 Vue 页面、TypeScript Pi Agent、知识和指标召回、Python 查询计算、结果核验及测评反馈；橙色标注待推进工作，不代表已经完成。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6e8cac"/></marker><marker id="loop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#3b857c"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;fill:#20364e}.code{font-family:Menlo,Consolas,monospace}</style>
<rect width="1600" height="1830" fill="white"/>
<text x="40" y="48" font-size="32" style="fill:#20364e" font-weight="650">Ask Metric｜后续优化目标架构</text><text x="40" y="82" font-size="18" style="fill:#5b7189">技术版 · 基于 develop-ws / 9707568；沿用 Pi Agent + Python + 数据库，橙色为待推进事项</text><text x="40" y="116" font-size="16" style="fill:#5b7189">蓝色 / 绿色框：已有能力与调用关系　　橙色：下一阶段工作　　虚线箭头：恢复或运行反馈</text><text x="40" y="161" font-size="20" style="fill:#20364e" font-weight="650">资料基础｜沿用现有维护能力，资料按需检索，不把全量指标交给模型</text><rect x="40" y="180" width="480" height="178" rx="11" fill="#f7f9fc" stroke="#cbd8e7" stroke-width="1.5" /><text x="62" y="215" font-size="22" style="fill:#20364e" font-weight="650">指标目录、口径与关系</text><text x="62" y="247" font-size="18" style="fill:#526b84">正式编码、名称、单位、统计口径与来源</text><text x="62" y="275" font-size="18" style="fill:#526b84">分类、组成及比例依赖等关系维护已具备</text><text x="62" y="321" font-size="17" style="fill:#94621a" font-weight="650">待完善：首批指标口径、来源血缘与适用条件</text><rect x="560" y="180" width="480" height="178" rx="11" fill="#f7f9fc" stroke="#cbd8e7" stroke-width="1.5" /><text x="582" y="215" font-size="22" style="fill:#20364e" font-weight="650">业务知识与指标关联</text><text x="582" y="247" font-size="18" style="fill:#526b84">业务说明、分析方法、案例与适用范围</text><text x="582" y="275" font-size="18" style="fill:#526b84">命中知识 → linked_catalog 正式指标候选</text><text x="582" y="321" font-size="17" style="fill:#94621a" font-weight="650">待完善：知识内容、关联准确性与覆盖范围</text><rect x="1080" y="180" width="480" height="178" rx="11" fill="#f7f9fc" stroke="#cbd8e7" stroke-width="1.5" /><text x="1102" y="215" font-size="22" style="fill:#20364e" font-weight="650">机构目录与数据范围</text><text x="1102" y="247" font-size="18" style="fill:#526b84">正式机构、别名、上下级及权限范围</text><text x="1102" y="275" font-size="18" style="fill:#526b84">目录层级已具备，事实数据决定能查到什么</text><text x="1102" y="321" font-size="17" style="fill:#94621a" font-weight="650">待核对：分行数据覆盖、汇总范围与可用期间</text><text x="40" y="409" font-size="20" style="fill:#20364e" font-weight="650">运行链路｜保留现有边界，重点提高每个环节的准确性和效率</text><rect x="550" y="435" width="500" height="80" rx="11" fill="#265faa" stroke="#265faa" stroke-width="1.5" /><text x="572" y="470" font-size="22" style="fill:white" font-weight="650">Vue 页面 → Agent 服务</text><text x="572" y="502" font-size="17" style="fill:#e7f0ff" class="code">POST /agent-api/sessions/{id}/prompt</text><rect x="550" y="585" width="500" height="165" rx="11" fill="#edf4fd" stroke="#a9c4e4" stroke-width="1.5" /><text x="572" y="620" font-size="22" style="fill:#20364e" font-weight="650">① TS / Pi：组装本次模型上下文</text><text x="572" y="652" font-size="17" style="fill:#526b84" class="code">AgentHarness(main) · inquiry_v1</text><text x="572" y="680" font-size="16" style="fill:#526b84" class="code">transform_context → prepareInquiryHistory</text><text x="572" y="708" font-size="18" style="fill:#526b84">原问题 + 已授权历史 + 主目标参考</text><text x="572" y="736" font-size="18" style="fill:#526b84">按需加入相关知识、候选口径与机构目录</text><rect x="40" y="545" width="440" height="218" rx="11" fill="#eef8f4" stroke="#9ecbbd" stroke-width="1.5" /><text x="62" y="580" font-size="22" style="fill:#20364e" font-weight="650">Python：业务知识召回</text><text x="62" y="612" font-size="16" style="fill:#526b84" class="code">POST /api/v1/business-knowledge/search</text><text x="62" y="640" font-size="18" style="fill:#526b84">文字评分 → 少量相关知识 + linked_catalog</text><text x="62" y="668" font-size="18" style="fill:#526b84">关联编码解析成正式候选，模型判断适用性</text><text x="62" y="696" font-size="18" style="fill:#526b84">loadTurnBusinessKnowledge 复用本轮快照</text><text x="62" y="724" font-size="16" style="fill:#526b84">当前知识路径未调用 Embedding</text><rect x="1120" y="545" width="440" height="218" rx="11" fill="#eef8f4" stroke="#9ecbbd" stroke-width="1.5" /><text x="1142" y="580" font-size="22" style="fill:#20364e" font-weight="650">Python：指标目录检索</text><text x="1142" y="612" font-size="15" style="fill:#526b84" class="code">metric_search → /api/v1/analysis/catalog</text><text x="1142" y="640" font-size="18" style="fill:#526b84">名称 / 编码 / 别名 → 候选与正式查询引用</text><text x="1142" y="668" font-size="18" style="fill:#526b84">无精确命中且已启用：Embedding 向量推荐</text><text x="1142" y="696" font-size="18" style="fill:#526b84">近似推荐仍需核对正式名称、定义与口径</text><text x="1142" y="724" font-size="16" style="fill:#526b84">返回指标定义，不返回实际业务数值</text><rect x="550" y="825" width="500" height="180" rx="11" fill="#edf4fd" stroke="#a9c4e4" stroke-width="1.5" /><text x="572" y="860" font-size="22" style="fill:#20364e" font-weight="650">② 模型决策：选指标、查数或补查</text><text x="572" y="892" font-size="18" style="fill:#526b84">根据业务目标与工具反馈选择下一步</text><text x="572" y="920" font-size="18" style="fill:#526b84">候选足够即可查询；不适用时继续检索</text><text x="572" y="948" font-size="18" style="fill:#526b84">工具调用经 inquiryToolAdmission 准入</text><text x="572" y="976" font-size="18" style="fill:#526b84">缺少用户决定的条件时澄清；有依据再回答</text><rect x="40" y="855" width="440" height="170" rx="11" fill="#f7f9fc" stroke="#cbd8e7" stroke-width="1.5" /><text x="62" y="890" font-size="22" style="fill:#20364e" font-weight="650">连续追问：沿用已有目标机制</text><text x="62" y="922" font-size="17" style="fill:#526b84" class="code">target_change → resolveInquiryTarget</text><text x="62" y="950" font-size="18" style="fill:#526b84">保存主题、机构和期间，指标可继续选择</text><text x="62" y="978" font-size="18" style="fill:#526b84">需验证：继承、切换、追加比较、话题变化</text><text x="62" y="997" font-size="17" style="fill:#94621a" font-weight="650">重点：查询对象与用户当前目标保持一致</text><rect x="1120" y="880" width="440" height="188" rx="11" fill="#eef8f4" stroke="#9ecbbd" stroke-width="1.5" /><text x="1142" y="915" font-size="22" style="fill:#20364e" font-weight="650">Python：受控查询与计算</text><text x="1142" y="947" font-size="16" style="fill:#526b84" class="code">metric_query → /analysis/execute</text><text x="1142" y="975" font-size="14" style="fill:#526b84" class="code">analysis_calculate → /analysis/calculations</text><text x="1142" y="1003" font-size="18" style="fill:#526b84">正式指标 / 机构 / 期间 → 权限与查询执行</text><text x="1142" y="1031" font-size="18" style="fill:#526b84">单位、精度、可比性及计算来源保持可核对</text><rect x="1120" y="1130" width="440" height="100" rx="11" fill="#eef8f4" stroke="#9ecbbd" stroke-width="1.5" /><text x="1142" y="1165" font-size="22" style="fill:#20364e" font-weight="650">数据库：指标事实与业务数据</text><text x="1142" y="1197" font-size="18" style="fill:#526b84">存储实际业务数值、统计期间与机构维度</text><rect x="550" y="1145" width="500" height="178" rx="11" fill="#edf4fd" stroke="#a9c4e4" stroke-width="1.5" /><text x="572" y="1180" font-size="22" style="fill:#20364e" font-weight="650">③ 统一业务回答与交付</text><text x="572" y="1212" font-size="18" style="fill:#526b84">模型生成正文 → analysis_answer</text><text x="572" y="1240" font-size="18" style="fill:#526b84">自然正文由 inquiryResponse 接入同一入口</text><text x="572" y="1268" font-size="16" style="fill:#526b84" class="code">executeInquiryReport → /analysis/report</text><text x="572" y="1296" font-size="18" style="fill:#526b84">核对来源、数值与目标覆盖，组合图表 / 明细</text><rect x="40" y="1145" width="440" height="178" rx="11" fill="#f7f9fc" stroke="#cbd8e7" stroke-width="1.5" /><text x="62" y="1180" font-size="22" style="fill:#20364e" font-weight="650">按失败原因恢复，收敛现有规则</text><text x="62" y="1212" font-size="18" style="fill:#526b84">格式问题局部修正；缺证据在预算内补查</text><text x="62" y="1240" font-size="18" style="fill:#526b84">权限失败停止访问；服务异常如实说明</text><text x="62" y="1268" font-size="18" style="fill:#526b84">保留无效重复停止与调用预算</text><text x="62" y="1298" font-size="17" style="fill:#94621a" font-weight="650">持续检查：有效纠错是否仍被误拦</text><rect x="550" y="1400" width="500" height="110" rx="11" fill="#edf4fd" stroke="#a9c4e4" stroke-width="1.5" /><text x="572" y="1435" font-size="22" style="fill:#20364e" font-weight="650">④ Vue：接收 SSE，展示问数结果</text><text x="572" y="1467" font-size="18" style="fill:#526b84">进展、正文、图表与明细</text><text x="572" y="1495" font-size="18" style="fill:#526b84">会话与来源由 Agent 服务持久化</text><rect x="1120" y="1320" width="440" height="172" rx="11" fill="#fffaf2" stroke="#d9b373" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1142" y="1355" font-size="21" style="fill:#20364e" font-weight="650">后续扩展：贡献分析与业务明细</text><text x="1142" y="1387" font-size="18" style="fill:#526b84">按已确认的指标关系与实际数据逐步建设</text><text x="1142" y="1415" font-size="18" style="fill:#526b84">补足两期对齐、总分核对、残差及贡献计算</text><text x="1142" y="1443" font-size="18" style="fill:#526b84">关系维护不等于自动归因，更不等于因果证明</text><path d="M800,515 L800,585" fill="none" stroke="#6e8cac" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M480,635 L550,635" fill="none" stroke="#6e8cac" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1120,612 L1080,612 L1080,665 L1050,665" fill="none" stroke="#6e8cac" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M800,750 L800,825" fill="none" stroke="#6e8cac" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="815" y="789" font-size="16" style="fill:#5b7189">RAG：相关资料进入模型上下文</text><path d="M1050,855 L1098,855 L1098,715 L1120,715" fill="none" stroke="#6e8cac" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1120" y="810" font-size="16" style="fill:#5b7189">候选不足：调用 metric_search</text><path d="M1050,920 L1120,920" fill="none" stroke="#6e8cac" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1064" y="906" font-size="15" style="fill:#5b7189">调用</text><path d="M1120,985 L1050,985" fill="none" stroke="#3b857c" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#loop)"/><path d="M1270,1068 L1270,1130" fill="none" stroke="#6e8cac" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1430,1130 L1430,1068" fill="none" stroke="#6e8cac" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M800,1005 L800,1145" fill="none" stroke="#6e8cac" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="817" y="1084" font-size="17" style="fill:#5b7189">证据足够：组织业务回答</text><path d="M550,1245 L512,1245 L512,955 L550,955" fill="none" stroke="#3b857c" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#loop)"/><path d="M800,1323 L800,1400" fill="none" stroke="#6e8cac" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="40" y="1551" font-size="21" style="fill:#20364e" font-weight="650">测评与优化反馈｜复用已建测评中心，在相同模型、数据与权限条件下验证</text><text x="40" y="1582" font-size="17" style="fill:#526b84">记录：选中的指标 / 查询条件 / 来源 / 最终答案，以及模型、检索、查询、交付各段耗时；反馈到对应环节。</text><rect x="40" y="1610" width="355" height="137" rx="11" fill="#fffaf2" stroke="#d9b373" stroke-width="1.5" stroke-dasharray="6 4"/><text x="62" y="1645" font-size="21" style="fill:#20364e" font-weight="650">1 · 准备首批资料</text><text x="62" y="1677" font-size="18" style="fill:#526b84">驾驶舱高频问题与指标优先</text><text x="62" y="1705" font-size="18" style="fill:#526b84">补齐口径、关联与数据覆盖</text><rect x="430" y="1610" width="355" height="137" rx="11" fill="#fffaf2" stroke="#d9b373" stroke-width="1.5" stroke-dasharray="6 4"/><text x="452" y="1645" font-size="21" style="fill:#20364e" font-weight="650">2 · 验证召回与追问</text><text x="452" y="1677" font-size="18" style="fill:#526b84">选对指标，继承正确条件</text><text x="452" y="1705" font-size="18" style="fill:#526b84">按问题类别处理共性缺陷</text><rect x="820" y="1610" width="355" height="137" rx="11" fill="#fffaf2" stroke="#d9b373" stroke-width="1.5" stroke-dasharray="6 4"/><text x="842" y="1645" font-size="21" style="fill:#20364e" font-weight="650">3 · 定位并优化耗时</text><text x="842" y="1677" font-size="18" style="fill:#526b84">减少无效检索、补查与往返</text><text x="842" y="1705" font-size="18" style="fill:#526b84">复用结果，核对生效条件</text><rect x="1210" y="1610" width="350" height="137" rx="11" fill="#fffaf2" stroke="#d9b373" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1232" y="1645" font-size="21" style="fill:#20364e" font-weight="650">4 · 对照验收再扩展</text><text x="1232" y="1677" font-size="18" style="fill:#526b84">人工复核 + 批次结果对比</text><text x="1232" y="1705" font-size="18" style="fill:#526b84">场景稳定后进入试运行</text><text x="40" y="1793" font-size="17" style="fill:#5b7189">方案边界：按需改进现有检索；不预设新增向量库、重排服务或第二套 Agent。目标效果需真实业务测评证明。</text></svg>