# 发布位置：/etc/nginx/conf.d/8090.conf（由主配置 http 块 include）。
# 将下面双引号内的两个域名占位值替换为行方实际分配值；后端 F5 值可包含端口。
# 静态文件：将 npm run build:bank 生成的 dist 内容放入 /home/source/html/frontend/。
# 复用主配置的 resolver、日志和运行参数；本文件不配置 upstream、TLS 或独立日志。
server {
    listen 8090;
    server_name "replace-with-frontend-domain.dmp.jsrcb";

    set $znws_backend_f5 "replace-with-backend-f5-domain.dmp.jsrcb:80";

    # 相对 Location 保留浏览器侧域名和协议，避免暴露内部 HTTP/8090。
    absolute_redirect off;
    index index.html;
    client_max_body_size 10m;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self' http://mh.dmp.jsrcb https://mh.dmp.jsrcb http://szns.dmp.jsrcb https://szns.dmp.jsrcb" always;

    location = /health {
        default_type text/plain;
        return 200 "healthy\n";
    }

    # 入口补斜杠和跳转都保留系统前缀及 token 等查询参数。
    location = /bgwblj/znws {
        return 302 /bgwblj/znws/static/$is_args$args;
    }
    location = /bgwblj/znws/ {
        return 302 /bgwblj/znws/static/$is_args$args;
    }
    location = /bgwblj/znws/static {
        return 302 /bgwblj/znws/static/$is_args$args;
    }

    # index 必须单独存在；否则 SPA 回退可能循环。HTML 每次重新验证，避免发布后旧入口缓存。
    location = /bgwblj/znws/static/index.html {
        alias /home/source/html/frontend/index.html;
        expires -1;
    }
    location ^~ /bgwblj/znws/static/assets/ {
        alias /home/source/html/frontend/assets/;
        expires 7d;
    }
    location = /bgwblj/znws/static/ask-metric.ico {
        alias /home/source/html/frontend/ask-metric.ico;
        expires 7d;
    }
    location /bgwblj/znws/static/ {
        alias /home/source/html/frontend/;
        try_files $uri $uri/ /bgwblj/znws/static/index.html;
        expires -1;
    }

    location = /bgwblj/znws/api {
        return 308 /bgwblj/znws/api/$is_args$args;
    }
    location ^~ /bgwblj/znws/api/ {
        # 只去掉外围系统前缀，网关仍收到原 /api/... 路径和查询参数。
        # 使用动态域名时先 rewrite，再用不带 URI 的 proxy_pass，避免路径被固定值覆盖。
        rewrite ^/bgwblj/znws(/api/.*)$ $1 break;
        proxy_pass http://$znws_backend_f5;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 外层可信网关须覆盖此头并传入浏览器原始协议；不要传内部 8090 作为外部端口。
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;

        # 登录、刷新和退出共用同一个 Cookie Path；不改动 HttpOnly/Secure/SameSite。
        proxy_cookie_path /api/v1/auth /bgwblj/znws/api/v1/auth;
        proxy_redirect ~^https?://[^/]+(/api(?:/.*)?)$ /bgwblj/znws$1;
        proxy_redirect ~^(/api(?:/.*)?)$ /bgwblj/znws$1;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        # 写操作不得在失败后由本层自动重试；负载均衡和健康检查由 F5 管理。
        proxy_next_upstream off;
    }

    location / {
        return 404;
    }
}
