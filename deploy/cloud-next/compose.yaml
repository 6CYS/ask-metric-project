name: ask-metric-next
services:
  backend:
    image: ask-metric-next-backend:${RELEASE_TAG:?set RELEASE_TAG}
    container_name: ask-metric-next-backend
    restart: unless-stopped
    mem_limit: 512m
    env_file: [./backend.env]
    volumes:
      - ./runtime-config:/app/runtime-config
      - ./model-secrets:/app/model-secrets
      - ./state:/app/state
      - ./logs:/app/logs
    secrets: [config_sm4_key]
    networks: [web, databases]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  agent:
    image: ask-metric-next-agent:${RELEASE_TAG:?set RELEASE_TAG}
    container_name: ask-metric-next-agent
    restart: unless-stopped
    mem_limit: 256m
    env_file: [./agent.env]
    volumes:
      - ./state/agent:/app/data
    secrets: [config_sm4_key]
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  frontend:
    image: ask-metric-next-frontend:${FRONTEND_RELEASE_TAG:-${RELEASE_TAG:?set RELEASE_TAG}}
    container_name: ask-metric-next-frontend
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "${WEB_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks: [web]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  web:
  databases:
    external: true
    name: ask-metric-cloud-db
secrets:
  config_sm4_key:
    file: ./secrets/config-sm4.key
